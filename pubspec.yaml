name: handrail_bug_reporter
description: Reusable Flutter integration surface for submitting Handrail mobile bug reports.
publish_to: none
version: 0.1.66

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Allow win32 5 and 6 graphs; stay on the plugin lines validated with Flutter 3.41.
  device_info_plus: ">=12.2.0 <13.2.0"
  http: ^1.2.2
  package_info_plus: ">=9.0.1 <10.2.0"
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.handrail.bugreporter
        pluginClass: HandrailBugReporterPlugin
      ios:
        pluginClass: HandrailBugReporterPlugin
